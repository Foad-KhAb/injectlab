[project]
name = "injectlab"
version = "0.1.0"
description = "A testbed for indirect prompt injection attacks and defenses on tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "ollama>=0.4",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
detector = [
    "torch>=2.3",
    "transformers>=4.44",
]

[project.scripts]
injectlab = "injectlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injectlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ollama: needs a running Ollama server with the dev model pulled (deselect with -m 'not ollama')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
